name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sql-check:
    name: SQL file check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ★デバッグ（今後のトラブル防止）
      - name: Debug - show directory structure
        run: |
          pwd
          ls -R

      # ★パス修正（ここが本質）
      - name: Check mlops SQL files exist
        run: |
          test -f sql/mlops/create_drift_detection_results.sql
          test -f sql/mlops/create_ab_test_analysis.sql
          test -f sql/mlops/create_retraining_decision.sql
          test -f sql/mlops/create_mlops_monitoring_view.sql

      - name: Check SQL files are not empty
        run: |
          test -s sql/mlops/create_drift_detection_results.sql
          test -s sql/mlops/create_ab_test_analysis.sql
          test -s sql/mlops/create_retraining_decision.sql
          test -s sql/mlops/create_mlops_monitoring_view.sql

      - name: Check CREATE OR REPLACE exists
        run: |
          grep -qi "CREATE OR REPLACE" sql/mlops/create_drift_detection_results.sql
          grep -qi "CREATE OR REPLACE" sql/mlops/create_ab_test_analysis.sql
          grep -qi "CREATE OR REPLACE" sql/mlops/create_retraining_decision.sql
          grep -qi "CREATE OR REPLACE" sql/mlops/create_mlops_monitoring_view.sql

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate