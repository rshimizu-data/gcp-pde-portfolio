name: Deploy predict-api to Cloud Run

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to deploy predict-api"
        required: true
        default: "NO"

env:
  PROJECT_ID: churn-analysis-491912
  REGION: asia-northeast1
  REPOSITORY: predict-api-repo
  IMAGE_NAME: predict-api
  SERVICE_NAME: predict-api
  SERVICE_ACCOUNT: predict-api-sa@churn-analysis-491912.iam.gserviceaccount.com
  MODEL_URI: gs://churn-model-bucket-ryo/models/model.pkl

jobs:
  deploy:
    name: Build, push, and deploy predict-api
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy confirmation
        if: github.event.inputs.confirm_deploy != 'DEPLOY'
        run: |
          echo "confirm_deploy must be DEPLOY"
          exit 1

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Set image URI
        run: |
          echo "IMAGE_URI=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_URI_LATEST=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:latest" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_URI} \
            -t ${IMAGE_URI_LATEST} \
            ./app

      - name: Push Docker image
        run: |
          docker push ${IMAGE_URI}
          docker push ${IMAGE_URI_LATEST}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE_NAME} \
            --image=${IMAGE_URI} \
            --region=${REGION} \
            --platform=managed \
            --service-account=${SERVICE_ACCOUNT} \
            --allow-unauthenticated \
            --set-env-vars="MODEL_URI=${MODEL_URI},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},PROJECT_ID=${PROJECT_ID}" \
            --port=8080 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --quiet

      - name: Get Cloud Run URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
            --region=${REGION} \
            --format="value(status.url)")
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV
          echo "Cloud Run URL: ${SERVICE_URL}"

      - name: Check health endpoint
        run: |
          curl -f "${SERVICE_URL}/health"

      - name: Complete
        run: |
          echo "deploy-predict-api workflow completed successfully."
          echo "Image: ${IMAGE_URI}"
          echo "Service URL: ${SERVICE_URL}"