name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type APPLY to run terraform apply"
        required: true
        default: "NO"

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    if: github.event.inputs.confirm_apply == 'APPLY'

    env:
      TF_VERSION: 1.6.6
      PROJECT_ID: churn-analysis-491912

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Show authenticated account
        run: gcloud auth list

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -var-file="./envs/prod.tfvars" -out=tfplan

      - name: Show Terraform plan
        working-directory: infra
        run: terraform show -no-color tfplan

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan
